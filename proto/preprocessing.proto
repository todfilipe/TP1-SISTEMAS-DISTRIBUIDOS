syntax = "proto3";

option csharp_namespace = "Preprocessing";

package preprocessing;

service PreprocessingService {
  rpc Normalize(RawReading) returns (NormalizedReading);
}

message RawReading {
  string sensorId = 1;
  string type = 2;
  double value = 3;
  string unit = 4;
  string timestamp = 5;
  string rawFormat = 6;
  // Zona a que pertence a leitura. Necessária na Fase 2 (Pub/Sub),
  // onde a routing key será <zona>.<tipo>.<idSensor>.
  string zone = 7;
}

message NormalizedReading {
  string sensorId = 1;
  string type = 2;
  double value = 3;
  string unit = 4;
  string timestamp = 5;
  string rawFormat = 6;
  bool isValid = 7;
  // Propagada a partir do RawReading.
  string zone = 8;
}
