      RABBIT_PORT: 5672
      RABBIT_USER: admin
      RABBIT_PASS: admin
      RABBIT_VHOST: onehealth
      RABBIT_EXCHANGE: sensors.exchange
      RABBIT_GATEWAY_EXCHANGE: gateway.exchange
      PREPROCESSING_SERVICE_URL: http://preprocessing:50051
    depends_on:
      rabbitmq:
        condition: service_healthy
      preprocessing:
        condition: service_healthy
    networks:
      - sd-net
    restart: unless-stopped

  gateway-parque:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    container_name: gateway-parque
    command: ["GW_PARQUE", "servidor", "9090", "8085", "ZONA_PARQUE.#"]
    environment:
      GATEWAY_SERVER_TRANSPORT: rabbit
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: admin
      RABBIT_PASS: admin
      RABBIT_VHOST: onehealth
      RABBIT_EXCHANGE: sensors.exchange
      RABBIT_GATEWAY_EXCHANGE: gateway.exchange
      PREPROCESSING_SERVICE_URL: http://preprocessing:50051
    depends_on:
      rabbitmq:
        condition: service_healthy
      preprocessing:
        condition: service_healthy
    networks:
      - sd-net
    restart: unless-stopped

