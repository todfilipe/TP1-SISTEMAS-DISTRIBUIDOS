# docker-compose.yml — Orquestração da Fase 1 (TP2 Sistemas Distribuídos)
# Arranca o broker RabbitMQ (Fase 2) e os dois serviços RPC Python (Fase 1).
# Nota: o atributo "version" foi removido por estar obsoleto em Docker Compose v2+.

x-sensor-node-common: &sensor-node-common
  build:
    context: .
    dockerfile: SensorNode/Dockerfile
  environment: &sensor-node-env
    INTERVAL_SECONDS: 5
    RABBIT_HOST: rabbitmq
    RABBIT_PORT: 5672
    RABBIT_USER: admin
    RABBIT_PASS: admin
    RABBIT_VHOST: onehealth
    PAYLOAD_FORMAT: JSON
    ENVIRONMENT_SERVICE_URL: http://environment:8001
  depends_on:
    rabbitmq:
      condition: service_healthy
    environment:
      condition: service_healthy
  networks:
    - sd-net
  restart: unless-stopped

x-sensor-csharp-common: &sensor-csharp-common
  build:
    context: .
    dockerfile: Sensor/Dockerfile
  environment: &sensor-csharp-env
    INTERVAL_SECONDS: 5
    RABBIT_HOST: rabbitmq
    RABBIT_PORT: 5672
    RABBIT_USER: admin
    RABBIT_PASS: admin
    RABBIT_VHOST: onehealth
    PAYLOAD_FORMAT: JSON
    ENVIRONMENT_SERVICE_URL: http://environment:8001
  depends_on:
    rabbitmq:
      condition: service_healthy
    environment:
      condition: service_healthy
  networks:
    - sd-net
  restart: unless-stopped

services:
  # ─────────────────────────────────────────────────────────────
  # RabbitMQ — broker Pub/Sub (usado na Fase 2)
  # ─────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # porta AMQP
      - "15672:15672"   # consola de gestão Web
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - sd-net
    healthcheck:
      # Confirma que o nó RabbitMQ está vivo e a responder
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────────
  # Pré-Processamento — serviço gRPC (porta 50051)
  # Recebe RawReading do Gateway e devolve NormalizedReading.
  # ─────────────────────────────────────────────────────────────
  preprocessing:
    build: ./services/preprocessing
    container_name: preprocessing
    ports:
      - "50051:50051"
    networks:
      - sd-net
    restart: unless-stopped
    healthcheck:
      # Teste TCP leve: confirma que a porta gRPC 50051 está aberta
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(s.connect_ex(('localhost',50051)))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────
  # Análise — serviço gRPC (porta 50052)
  # Recebe leituras (no request) e devolve estatísticas/previsões.
  # O volume ./data continua montado (read-only) por compatibilidade
  # com o TP1; na Fase 3 será substituído pelo MongoDB.
  # ─────────────────────────────────────────────────────────────
  analysis:
    build: ./services/analysis
    container_name: analysis
    ports:
      - "50052:50052"
    volumes:
      - ./data:/app/data:ro
    networks:
      - sd-net
    restart: unless-stopped
    healthcheck:
      # Teste TCP leve: confirma que a porta gRPC 50052 está aberta
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(s.connect_ex(('localhost',50052)))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MongoDB - persistent database for Phase 3
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-urbanodb}
    volumes:
      - mongodb_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - sd-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Mongo Express - browser UI for development
  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGODB_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGODB_ROOT_PASSWORD:-admin}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME:-admin}:${MONGODB_ROOT_PASSWORD:-admin}@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - sd-net
    restart: unless-stopped

  servidor:
    build:
      context: .
      dockerfile: Servidor/Dockerfile
    container_name: servidor
    ports:
      - "9090:9090"
      - "9091:9091"
    environment:
      MONGODB_URI: mongodb://${MONGODB_ROOT_USERNAME:-admin}:${MONGODB_ROOT_PASSWORD:-admin}@mongodb:27017/${MONGODB_DATABASE:-urbanodb}?authSource=admin
      MONGODB_DATABASE: ${MONGODB_DATABASE:-urbanodb}
      ANALYSIS_SERVICE_URL: http://analysis:50052
      SERVER_HTTP_ENABLED: "true"
      SERVER_HTTP_PORT: 9091
      SERVER_RABBIT_ENABLED: "true"
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: admin
      RABBIT_PASS: admin
      RABBIT_VHOST: onehealth
      RABBIT_GATEWAY_EXCHANGE: gateway.exchange
      RABBIT_GATEWAY_QUEUE: server.gateway.ingest
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      analysis:
        condition: service_healthy
    networks:
      - sd-net
    restart: unless-stopped

  # Dashboard web - paginas HTML e JSON sobre os dados MongoDB
  dashboard:
    build:
      context: .
      dockerfile: Dashboard/Dockerfile
    container_name: dashboard
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://${MONGODB_ROOT_USERNAME:-admin}:${MONGODB_ROOT_PASSWORD:-admin}@mongodb:27017/${MONGODB_DATABASE:-urbanodb}?authSource=admin
      SERVER_API_URL: http://servidor:9091
    depends_on:
      mongodb:
        condition: service_healthy
      servidor:
        condition: service_started
    networks:
      - sd-net
    restart: unless-stopped

  environment:
    build: ./services/environment
    container_name: environment
    ports:
      - "8001:8001"
    networks:
      - sd-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway-centro:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    container_name: gateway-centro
    command: ["GW_CENTRO", "servidor", "9090", "8081", "ZONA_CENTRO.#"]
    environment:
      GATEWAY_SERVER_TRANSPORT: rabbit
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: admin
      RABBIT_PASS: admin
      RABBIT_VHOST: onehealth
      RABBIT_EXCHANGE: sensors.exchange
      RABBIT_GATEWAY_EXCHANGE: gateway.exchange
      PREPROCESSING_SERVICE_URL: http://preprocessing:50051
    depends_on:
      rabbitmq:
        condition: service_healthy
      preprocessing:
        condition: service_healthy
    networks:
      - sd-net
    restart: unless-stopped

  gateway-escolar:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    container_name: gateway-escolar
    command: ["GW_ESCOLAR", "servidor", "9090", "8082", "ZONA_ESCOLAR.#"]
    environment:
      GATEWAY_SERVER_TRANSPORT: rabbit
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: admin
      RABBIT_PASS: admin
      RABBIT_VHOST: onehealth
      RABBIT_EXCHANGE: sensors.exchange
      RABBIT_GATEWAY_EXCHANGE: gateway.exchange
      PREPROCESSING_SERVICE_URL: http://preprocessing:50051
    depends_on:
      rabbitmq:
        condition: service_healthy
      preprocessing:
        condition: service_healthy
    networks:
      - sd-net
    restart: unless-stopped

  gateway-industrial:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    container_name: gateway-industrial
    command: ["GW_INDUSTRIAL", "servidor", "9090", "8083", "ZONA_INDUSTRIAL.#"]
    environment:
      GATEWAY_SERVER_TRANSPORT: rabbit
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: admin
      RABBIT_PASS: admin
      RABBIT_VHOST: onehealth
      RABBIT_EXCHANGE: sensors.exchange
      RABBIT_GATEWAY_EXCHANGE: gateway.exchange
      PREPROCESSING_SERVICE_URL: http://preprocessing:50051
    depends_on:
      rabbitmq:
        condition: service_healthy
      preprocessing:
        condition: service_healthy
    networks:
      - sd-net
    restart: unless-stopped

  gateway-residencial:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    container_name: gateway-residencial
    command: ["GW_RESIDENCIAL", "servidor", "9090", "8084", "ZONA_RESIDENCIAL.#"]
    environment:
      GATEWAY_SERVER_TRANSPORT: rabbit
